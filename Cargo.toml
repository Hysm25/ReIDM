[package]
name = "reidm"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "cookies", "json"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
chrono = { version = "0.4", features = ["serde"] }
percent-encoding = "2.3"
regex = "1.10"
byteorder = "1.5"
tokio-tungstenite = "0.24"
quick-xml = "0.36"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.29", features = ["all_loaders"] }
image = { version = "0.25", default-features = false, features = ["png"] }

